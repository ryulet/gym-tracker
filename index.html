    {id:"a3e4",name:"ライイングEXT",target:"三頭筋",sets:3,note:"軽め20kg×12・三頭テスト・肘だけ・肩に乗ったら即中止"},

var C = getComputedStyle(document.documentElement);
function cv(n){return C.getPropertyValue("--"+n).trim();}

/* ============================ ユーティリティ ============================ */
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function formatDate(s){if(!s)return "—";var p=s.split("-");return parseInt(p[1])+"/"+parseInt(p[2]);}
function formatDateFull(s){if(!s)return "";var p=s.split("-");return p[0]+"年"+parseInt(p[1])+"月"+parseInt(p[2])+"日";}
function genExId(){return "ex_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);}
function genPid(){return "p_"+Date.now()+"_"+Math.random().toString(36).slice(2,5);}
function deepCopy(o){return JSON.parse(JSON.stringify(o));}
function daysRemaining(endDate){if(!endDate)return null;var n=new Date();n.setHours(0,0,0,0);var e=new Date(endDate);e.setHours(0,0,0,0);return Math.ceil((e-n)/(1000*60*60*24));}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ============================ データ層 ============================ */
/* 種目ごとのレスト秒数：名前から自動判定（4段階・研究＋りゅうくんの実態ベース）。
   exに rest があればそれを優先（メニューJSONやアプリで個別変更できる）。
   長め150=高重量の主役級複合 / 中長120=中重量複合や息が上がる種目 /
   中90=効かせたい単関節 / 短60=軽い効かせ系 */
function restFor(ex){
  if(ex && typeof ex.rest==="number") return ex.rest;
  var n=(ex&&ex.name)||"";
  var has=function(arr){for(var i=0;i<arr.length;i++){if(n.indexOf(arr[i])>=0)return true;}return false;};
  // ① 60秒：軽い効かせ・単関節（先に判定。インクラインリアレイズ等の巻き込み防止）
  if(has(["サイドレイズ","リアレイズ","フェイスプル","クランチ","立ちコロ","アブローラー","カーフ"])) return 60;
  // ② 90秒：単関節の中重量（カール・EXT・プッシュダウン・フライ。インクラインDBカール等もここ）
  if(has(["カール","エクステンション","EXT","プッシュダウン","フライ","キックバック"])) return 90;
  // ③ 150秒：高重量の主役級複合
  if(has(["ベンチ","ラットプル","シーテッドロー","シーテッドロウ","懸垂","チンニング","ディップス","デッド","スクワット"])) return 150;
  // ④ 120秒：中重量の複合 or 息が上がる種目
  if(has(["インクライン","チェストサポート","DBプレス","ダンベルプレス","ショルダープレス","クロスオーバー","ワイパー","ハンギング","ニーレイズ","レッグレイズ","OHP","ロー","ロウ","プレス"])) return 120;
  // それ以外
  return 90;
}
function fmtRest(sec){var m=Math.floor(sec/60),s=sec%60;return m+":"+String(s).padStart(2,"0");}

/* ============================ レストタイマー ============================ */
var restState={remain:0,total:0,timer:null};
var _audioCtx=null;
function unlockAudio(){
  try{ var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx)return;
    if(!_audioCtx)_audioCtx=new Ctx();
    if(_audioCtx.state==="suspended")_audioCtx.resume();
    // 無音を一瞬鳴らしてアンロック
    var o=_audioCtx.createOscillator(),g=_audioCtx.createGain();g.gain.value=0;o.connect(g);g.connect(_audioCtx.destination);o.start();o.stop(_audioCtx.currentTime+0.01);
  }catch(e){}
}
function startRest(sec){
  if(!sec||sec<=0)return;
  unlockAudio();
  restState.remain=sec; restState.total=sec;
  if(restState.timer)clearInterval(restState.timer);
  ensureRestBar();
  updateRestBar();
  restState.timer=setInterval(function(){
    restState.remain--;
    if(restState.remain<=0){ clearInterval(restState.timer); restState.timer=null; restDone(); }
    updateRestBar();
  },1000);
}
function stopRest(){ if(restState.timer)clearInterval(restState.timer); restState.timer=null; restState.remain=0; var b=document.getElementById("restbar"); if(b)b.remove(); }
function addRest(d){ if(restState.remain<=0)return; restState.remain=Math.max(0,restState.remain+d); restState.total=Math.max(restState.total,restState.remain); updateRestBar(); }
function ensureRestBar(){
  if(document.getElementById("restbar"))return;
  var bar=document.createElement("div");
  bar.id="restbar";
  bar.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:80;background:linear-gradient(180deg,rgba(8,9,12,0),#0a0b0e 24%);padding:14px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom));";
  document.body.appendChild(bar);
}
function updateRestBar(){
  var bar=document.getElementById("restbar"); if(!bar)return;
  var pct=restState.total>0?(restState.remain/restState.total)*100:0;
  var m=Math.floor(restState.remain/60), s=restState.remain%60;
  var disp=m+":"+String(s).padStart(2,"0");
  bar.innerHTML=
    '<div style="max-width:560px;margin:0 auto;background:rgba(18,20,24,0.96);border:1px solid rgba(63,208,200,.3);border-radius:16px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.6)">'
    +'<div style="display:flex;align-items:center;gap:12px">'
    +'<div style="font-size:9px;font-weight:800;letter-spacing:2px;color:var(--accent)">REST</div>'
    +'<div style="font-size:30px;font-weight:900;color:#f6f6f5;font-variant-numeric:tabular-nums;line-height:1;min-width:78px">'+disp+'</div>'
    +'<div style="flex:1;display:flex;gap:6px;justify-content:flex-end">'
    +'<button onclick="addRest(-15)" style="padding:8px 11px;border-radius:9px;border:1px solid var(--border);background:var(--glass);color:var(--sub);font-size:12px;font-weight:700">−15</button>'
    +'<button onclick="addRest(15)" style="padding:8px 11px;border-radius:9px;border:1px solid var(--border);background:var(--glass);color:var(--sub);font-size:12px;font-weight:700">+15</button>'
    +'<button onclick="stopRest()" style="padding:8px 14px;border-radius:9px;border:none;background:var(--accent);color:#062925;font-size:12px;font-weight:800">スキップ</button>'
    +'</div></div>'
    +'<div style="height:4px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin-top:10px"><div style="height:100%;width:'+pct+'%;background:var(--accent);border-radius:3px;transition:width 1s linear"></div></div>'
    +'</div>';
}
function restDone(){
  // 音（開始時にアンロックした_audioCtxを使う）長め・大きめ・通る音
  try{
    var ac=_audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    // 全体を持ち上げるマスターゲイン
    var master=ac.createGain(); master.gain.value=1.0; master.connect(ac.destination);
    // 5連のビープ（音楽に埋もれにくいよう基音＋上の倍音を重ねる）
    var beeps=[0,0.28,0.56,0.84,1.18]; // 最後だけ少し間を空けて「終わった」感
    beeps.forEach(function(t,idx){
      var last=(idx===beeps.length-1);
      var dur=last?0.5:0.22;            // 最後の音は長く伸ばす
      [880,1320].forEach(function(freq,fi){ // 880Hz＋その上、2音重ねて太く
        var o=ac.createOscillator(),g=ac.createGain();
        o.connect(g);g.connect(master);
        o.type=fi===0?"square":"sine";   // squareは通る、sineで角を取る
        o.frequency.value=freq;
        var amp=fi===0?0.5:0.22;
        g.gain.setValueAtTime(0.0001,ac.currentTime+t);
        g.gain.exponentialRampToValueAtTime(amp,ac.currentTime+t+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+t+dur);
        o.start(ac.currentTime+t);
        o.stop(ac.currentTime+t+dur+0.02);
      });
    });
  }catch(e){}
  // バイブ（長め）
  try{ if(navigator.vibrate)navigator.vibrate([300,120,300,120,400]); }catch(e){}
  // 表示を「完了」に
  var bar=document.getElementById("restbar");
  if(bar){
    bar.innerHTML='<div style="max-width:560px;margin:0 auto;background:rgba(63,208,200,0.12);border:1px solid var(--accent);border-radius:16px;padding:14px;text-align:center;color:var(--accent);font-size:15px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.6)">✦ レスト完了 — 次のセットへ</div>';
    setTimeout(function(){var b=document.getElementById("restbar");if(b)b.remove();},2500);
  }
}

/* 画面を離れて戻ったとき：裏で止まっていたタイマーは中途半端な値を残さず消す */
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible" && restState.timer===null && restState.remain>0){
    restState.remain=0; var b=document.getElementById("restbar"); if(b)b.remove();
  }
});

function freshProgram(name,menu){
  return {name:name,menu:deepCopy(menu),sessions:{},memos:{},endDate:""};
}

function seedDB(){
  var ac     = freshProgram("AC関節期",REHAB_MENU);
  var normal = freshProgram("通常プログラム",NORMAL_MENU);
  // 今使うのはAC関節期なので、それを初期表示にする
  var db = {version:3, activePid:"ac", _rehabSeeded:true,
    programs:{ "ac":ac, "normal":normal } };
  return db;
}

/* 旧 v2/v1 ({sessions,menu,memos,endDate}) を programs 形式に包む */
function migrateLegacy(obj){
  var prog = {
    name:"通常プログラム（旧記録）",
    menu: (obj && obj.menu) ? obj.menu : deepCopy(NORMAL_MENU),
    sessions: (obj && obj.sessions) ? obj.sessions : {},
    memos: (obj && obj.memos) ? obj.memos : {},
    endDate: (obj && obj.endDate) ? obj.endDate : ""
  };
  // 旧記録は保持しつつ、新しいAC関節期・通常を足して、今使うACを初期表示に
  var db = {version:3, activePid:"ac", _rehabSeeded:true,
    programs:{ "ac":freshProgram("AC関節期",REHAB_MENU), "normal":freshProgram("通常プログラム",NORMAL_MENU), "legacy":prog }};
  return db;
}

function loadDB(){
  // 1) v4（現行）が正常に読めればそれを使う
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(raw){ var d=JSON.parse(raw); if(d&&d.programs) return normalizeDB(d); }
  }catch(e){}
  // 2) 本体が無い/壊れている → いきなり初期化せず、まずバックアップから復旧を試みる
  //    （iOSがストレージを消した/本体JSONが破損した場合でも、過去記録を救出できる）
  var rec=recoverDB();
  if(rec){ return rec; }
  // 3) 復旧先も無い＝本当の初回。古いバージョンを掃除して最新メニューで作り直す。
  cleanupLegacy();
  var s=seedDB(); saveDB(s); return s;
}

function cleanupLegacy(){
  for(var i=0;i<LEGACY_KEYS.length;i++){
    try{ localStorage.removeItem(LEGACY_KEYS[i]); }catch(e){}
  }
}

function normalizeDB(d){
  if(!d||!d.programs){return seedDB();}
  if(!d.activePid||!d.programs[d.activePid]){d.activePid=Object.keys(d.programs)[0];}
  // リハビリ未シードの古いv3にも一応注入（一度だけ）
  if(!d._rehabSeeded && !d.programs["ac"]){
    d.programs["ac"]=freshProgram("AC関節期",REHAB_MENU);
    d._rehabSeeded=true;
  }
  return d;
}

var DB = loadDB();
var saveOK = true;

function saveDB(d){
  d = d||DB;
  try{
    var json=JSON.stringify(d);
    localStorage.setItem(STORAGE_KEY, json);
    // 保存検証：書いた内容を読み直して一致を確認（記録消失バグの再発防止）
    var back = localStorage.getItem(STORAGE_KEY);
    saveOK = (back && back.length>0 && back===json);
    // ★ミラー：本体が壊れた/消えた時の即時復旧用（常に同じ内容を二重書き）
    try{ localStorage.setItem(STORAGE_KEY+"_mirror", json); }catch(e){}
    // ★日次スナップショット：1日1つ、最大5世代残す（過去消失時に巻き戻せる保険）
    try{ saveDailySnapshot(json); }catch(e){}
  }catch(e){ saveOK=false; }
  return saveOK;
}

/* 日次スナップショット：キー = SNAP_PREFIX + 日付。古いものは5世代だけ残す。 */
function saveDailySnapshot(json){
  var today=todayStr();
  localStorage.setItem(SNAP_PREFIX+today, json);
  // 世代整理：snapキーを集めて、新しい順に5個だけ残す
  var snaps=[];
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k && k.indexOf(SNAP_PREFIX)===0) snaps.push(k);
  }
  snaps.sort(); // 日付昇順（YYYY-MM-DD）
  while(snaps.length>5){ var old=snaps.shift(); try{localStorage.removeItem(old);}catch(e){} }
}

/* 復旧：本体が読めない/壊れている時に、ミラー→最新スナップの順で救出する。 */
function recoverDB(){
  // 1) ミラー
  try{
    var mir=localStorage.getItem(STORAGE_KEY+"_mirror");
    if(mir){ var dm=JSON.parse(mir); if(dm&&dm.programs){ localStorage.setItem(STORAGE_KEY,mir); return normalizeDB(dm); } }
  }catch(e){}
  // 2) 最新の日次スナップショット
  try{
    var snaps=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(SNAP_PREFIX)===0)snaps.push(k);}
    snaps.sort();
    if(snaps.length){
      var latest=localStorage.getItem(snaps[snaps.length-1]);
      var ds=JSON.parse(latest);
      if(ds&&ds.programs){ localStorage.setItem(STORAGE_KEY,latest); return normalizeDB(ds); }
    }
  }catch(e){}
  return null;
}

/* ============================ アクティブ参照ヘルパー ============================ */
function prog(){return DB.programs[DB.activePid];}
function menu(){return prog().menu;}
function sessions(){return prog().sessions;}
function memos(){return prog().memos;}

/* UI状態（保存しない一時状態） */
var UI = { day:null, view:"workout", expanded:null, modal:null };
function firstDayKey(){var k=Object.keys(menu()).map(Number).sort(function(a,b){return a-b;});return k.length?k[0]:null;}
function ensureDay(){ if(UI.day==null||!menu()[UI.day]){UI.day=firstDayKey();} }

/* セッション・セット操作（すべてアクティブプログラム内に閉じる） */
function sessKey(){return "day"+UI.day+"_"+todayStr();}
function getSet(exId,si){var s=sessions()[sessKey()];if(!s)return {weight:"",reps:"",done:false};return s.sets[exId+"_s"+si]||{weight:"",reps:"",done:false};}
function writeSet(exId,si,patch){
  var t=todayStr();var key=sessKey();
  var s=sessions()[key]||{date:t,day:UI.day,sets:{}};
  var k=exId+"_s"+si;
  var cur=s.sets[k]||{weight:"",reps:"",done:false};
  s.sets[k]=Object.assign({},cur,patch);
  s.date=t; s.day=UI.day;
  sessions()[key]=s;
  saveDB();
}
function toggleDone(exId,si){var sd=getSet(exId,si);writeSet(exId,si,{done:!sd.done});}

/* お休み（スキップ）：その日のその種目を「意図的に休む」と記録 */
function isSkipped(exId){var s=sessions()[sessKey()];return !!(s&&s.skipped&&s.skipped[exId]);}

/* その日のその種目の実セット数：メニューのsets + 当日の増減（extra）。最低1。 */
function setCountFor(ex){
  var s=sessions()[sessKey()];
  var extra=(s&&s.extraSets&&s.extraSets[ex.id])||0;
  return Math.max(1, ex.sets+extra);
}
function changeSetCount(exId,delta){
  var t=todayStr();var key=sessKey();
  var s=sessions()[key]||{date:t,day:UI.day,sets:{}};
  if(!s.extraSets)s.extraSets={};
  var ex=null; menu()[UI.day].exercises.forEach(function(e){if(e.id===exId)ex=e;});
  if(!ex)return;
  var cur=ex.sets+((s.extraSets[exId])||0);
  var next=Math.max(1,cur+delta);             // 1未満にはしない
  var newExtra=next-ex.sets;
  s.extraSets[exId]=newExtra;
  // 減らした場合、消えるセットの入力データも掃除
  if(delta<0){ for(var i=next;i<cur;i++){ delete s.sets[exId+"_s"+i]; } }
  s.date=t; s.day=UI.day;
  sessions()[key]=s;
  saveDB();
}
function toggleSkip(exId){
  var t=todayStr();var key=sessKey();
  var s=sessions()[key]||{date:t,day:UI.day,sets:{}};
  if(!s.skipped)s.skipped={};
  if(s.skipped[exId]){ delete s.skipped[exId]; }
  else{
    s.skipped[exId]=true;
    // 入力データは消さない（お休み解除で元の記録が戻るように）。お休みフラグだけ立てる。
    // コピー出力では「お休み」と表示して実記録は出さない制御を入れているので、データを残しても混ざらない。
  }
  s.date=t; s.day=UI.day;
  sessions()[key]=s;
  saveDB();
}

function prevSession(dn){
  var t=todayStr();
  var keys=Object.keys(sessions()).filter(function(k){return k.indexOf("day"+dn+"_")===0 && k!=="day"+dn+"_"+t;}).sort().reverse();
  return keys.length?sessions()[keys[0]]:null;
}
function prevSet(dn,exId,si){var p=prevSession(dn);return p?(p.sets[exId+"_s"+si]||null):null;}
function prevDate(dn){var p=prevSession(dn);return p?p.date:null;}
function lastDate(dn){var keys=Object.keys(sessions()).filter(function(k){return k.indexOf("day"+dn+"_")===0;}).sort().reverse();return keys.length?sessions()[keys[0]].date:null;}
function history(dn){return Object.keys(sessions()).filter(function(k){return k.indexOf("day"+dn+"_")===0;}).sort().reverse().map(function(k){return sessions()[k];});}

function fillFromPrev(exId,si){var p=prevSet(UI.day,exId,si);if(p)writeSet(exId,si,{weight:p.weight||"",reps:p.reps||""});}
function fillAllFromPrev(exId,sets){for(var i=0;i<sets;i++){var p=prevSet(UI.day,exId,i);if(p)writeSet(exId,i,{weight:p.weight||"",reps:p.reps||""});}}

function getMemo(exId){return memos()[sessKey()+"_"+exId]||"";}
function setMemo(exId,v){memos()[sessKey()+"_"+exId]=v;saveDB();}

/* メニュー編集 */
function addExercise(name,target,warmup){if(!name.trim())return;var m=menu();m[UI.day].exercises.push({id:genExId(),name:name.trim(),target:target.trim(),sets:3,warmup:!!warmup});saveDB();}
function removeExercise(exId){var d=menu()[UI.day];d.exercises=d.exercises.filter(function(e){return e.id!==exId;});saveDB();}
function moveExercise(idx,dir){var a=menu()[UI.day].exercises;var ni=idx+dir;if(ni<0||ni>=a.length)return;var t=a[idx];a[idx]=a[ni];a[ni]=t;saveDB();}
function setExSets(exId,n){var d=menu()[UI.day];d.exercises.forEach(function(e){if(e.id===exId)e.sets=Math.max(1,Math.min(9,n));});saveDB();}
function updateDayInfo(f,v){menu()[UI.day][f]=v;saveDB();}
function addDay(title,subtitle){if(!title.trim())return;var m=menu();var nk=Math.max.apply(null,Object.keys(m).map(Number).concat([0]))+1;m[nk]={title:title.trim(),subtitle:subtitle.trim()||"カスタム",exercises:[]};saveDB();UI.day=nk;}
function removeDay(dn){var m=menu();delete m[dn];saveDB();UI.day=firstDayKey();}

/* プログラム管理 */
function switchProgram(pid){if(DB.programs[pid]){DB.activePid=pid;UI.day=null;UI.expanded=null;UI.view="workout";saveDB();ensureDay();}}
function addProgram(name,fromMenu){var pid=genPid();DB.programs[pid]=freshProgram(name||"新しいプログラム", fromMenu||{});DB.activePid=pid;UI.day=null;saveDB();ensureDay();}
function renameProgram(pid,name){if(DB.programs[pid])DB.programs[pid].name=name;saveDB();}
function removeProgram(pid){if(Object.keys(DB.programs).length<=1)return;delete DB.programs[pid];if(DB.activePid===pid)DB.activePid=Object.keys(DB.programs)[0];UI.day=null;saveDB();ensureDay();}

/* メニュー差し替え：JSON文字列で現プログラムのメニューを上書き（記録は保持）。
   受け付ける形：{"1":{title,subtitle,exercises:[...]},...}  または  {menu:{...}} でも可 */
/* 種目名から安定した一意idを作る。同じ名前なら常に同じidになるので、
   メニュー差し替えで並びが変わっても記録が正しく紐づく（記録取り違え防止）。
   日本語も扱えるよう簡易ハッシュを使う。同名が同Dayに複数あれば連番で分ける。 */
function hashStr(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return h.toString(36);}
function stableExId(dayKey,name,usedIds){
  var base="d"+dayKey+"_"+hashStr(String(name||"noname"));
  var id=base, n=2;
  while(usedIds[id]){ id=base+"_"+n; n++; }
  usedIds[id]=true;
  return id;
}

function replaceMenuFromJSON(raw){
  var obj;
  try{obj=JSON.parse(raw);}catch(e){return {ok:false,msg:"読み取れなかった。{ } で始まるメニューJSONをそのまま貼ってね。"};}
  var m = obj.menu ? obj.menu : obj;          // {menu:{...}} でも素の {...} でも受ける
  var keys = Object.keys(m);
  if(!keys.length) return {ok:false,msg:"Dayが見つからなかった。形式を確認してね。"};
  // 妥当性チェック＆id自動補完
  // ★重要：idは「位置」ではなく「種目名」から安定生成する。
  //   位置ベース(d1e1…)だと、差し替えで並びが変わったとき過去記録が別種目に化ける（記録取り違えバグの原因）。
  //   同じ種目名なら常に同じidになるので、並びが変わっても記録が正しく紐づく。
  var clean={};
  var usedIds={};
  for(var ki=0;ki<keys.length;ki++){
    var dk=keys[ki];
    var day=m[dk];
    if(!day||!Array.isArray(day.exercises)) return {ok:false,msg:"Day"+dk+" に exercises 配列が無いみたい。"};
    var exs=day.exercises.map(function(ex,i){
      var eid = ex.id ? String(ex.id) : stableExId(dk, ex.name, usedIds);
      return {
        id: eid,
        name: String(ex.name||"種目"+(i+1)),
        target: String(ex.target||""),
        sets: (typeof ex.sets==="number"&&ex.sets>0)?ex.sets:3,
        warmup: !!ex.warmup,
        rest: (typeof ex.rest==="number"&&ex.rest>0)?ex.rest:undefined,
        note: ex.note?String(ex.note):undefined
      };
    });
    clean[dk]={title:String(day.title||("Day "+dk)),subtitle:String(day.subtitle||"カスタム"),exercises:exs};
  }
  prog().menu = clean;
  // 差し替え後、消えたDayにUIが取り残されないように
  UI.day=null;
  saveDB();
  ensureDay();
  return {ok:true,msg:"メニューを差し替えたよ（"+keys.length+"日分）。記録はそのまま残ってる。"};
}

function clearToday(){
  var key=sessKey();
  delete sessions()[key];
  var pre=key+"_";var mm=memos();Object.keys(mm).forEach(function(k){if(k.indexOf(pre)===0)delete mm[k];});
  saveDB();
}

/* 今日の記録コピー（旧バグ：同重量2セット目以降が—になる問題を修正） */
function exportToday(){
  var s=sessions()[sessKey()]||{sets:{}};var dm=menu()[UI.day];
  var t="📅 "+formatDateFull(todayStr())+"  "+prog().name+" / Day"+UI.day+"："+dm.title+"\n\n";
  var any=false; var rested=[];
  dm.exercises.forEach(function(ex){
    if(isSkipped(ex.id)){ rested.push(ex.name); return; }
    var nS=setCountFor(ex);
    // この種目を「今日やった」とみなすか：どれか1セットでも入力or完了✓があれば true
    var touched=false;
    for(var t2=0;t2<nS;t2++){var sdt=s.sets[ex.id+"_s"+t2];if(sdt&&(sdt.weight!==""||sdt.reps!==""||sdt.done)){touched=true;break;}}
    if(!touched) return; // 一切触っていない種目はコピーに出さない
    var lines=[];
    for(var i=0;i<nS;i++){
      var sd=s.sets[ex.id+"_s"+i]||{weight:"",reps:"",done:false};
      var w=sd.weight, r=sd.reps;
      var pv=prevSet(UI.day,ex.id,i);
      // ★kgと回数を「別々に」判定して補完する。
      //   片方だけ入力しても、もう片方は前回値で埋める（—で飛ばさない）。
      var wFromPrev=false, rFromPrev=false;
      if((w===""||w==null) && pv && pv.weight!=="" && pv.weight!=null){ w=pv.weight; wFromPrev=true; }
      if((r===""||r==null) && pv && pv.reps!==""   && pv.reps!=null){   r=pv.reps;   rFromPrev=true; }
      var wd=(w!==""&&w!=null)?w:"—";
      var rd=(r!==""&&r!=null)?r:"—";
      var prevTag=(wFromPrev||rFromPrev)?"（前回と同じ）":"";
      lines.push("  Set"+(i+1)+": "+wd+"kg × "+rd+"回"+(sd.done?" ✓":"")+prevTag);
    }
    if(lines.length){
      any=true;
      t+="▸ "+ex.name+"（"+ex.target+"）\n"+lines.join("\n")+"\n";
      var m=getMemo(ex.id);if(m)t+="  💬 "+m+"\n";
      t+="\n";
    }
  });
  if(!any)t+="まだ記録がないよ！\n";
  if(rested.length){ t+="\n— 今日お休みした種目 —\n"; rested.forEach(function(n){t+="  ・"+n+"\n";}); }
  return t;
}

    html+='<span style="font-size:8px;opacity:.5;margin-top:1px">'+(ld?"前回 "+formatDate(ld):"—")+'</span></button>';
  });
  html+='</div>';
  html+='</div></div>';

  /* ---- ビュータブ ---- */
  html+='<div style="display:flex;gap:4px;padding:14px 18px 0">';
  [["workout","トレーニング"],["history","履歴"],["edit","編集"]].forEach(function(v){
    var on=UI.view===v[0];
    html+='<button data-act="setView" data-view="'+v[0]+'" style="flex:1;padding:10px 4px 11px;border:none;border-bottom:2px solid '+(on?'var(--accent)':'transparent')+';background:transparent;color:'+(on?'var(--accentLight)':'var(--muted)')+';font-size:12px;font-weight:'+(on?'800':'600')+';letter-spacing:.5px">'+v[1]+'</button>';
  });
  html+='</div>';

  if(!menu()[UI.day]){ html+='<div style="padding:60px 20px;text-align:center;color:var(--muted)">Dayがありません。「編集」から追加してね。</div>'; }
  else if(UI.view==="workout"){ html+=renderWorkout(); }
  else if(UI.view==="history"){ html+=renderHistory(); }
  else if(UI.view==="edit"){ html+=renderEdit(); }

  /* 保存状態インジケータ（消失バグ対策の安心材料） */
  if(!saveOK){
    html+='<div style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--dangerBg);border:1px solid var(--danger);color:#ffb4a8;padding:8px 16px;border-radius:10px;font-size:12px;z-index:50">⚠ 保存に失敗。ブラウザのストレージ設定を確認してね</div>';
  }

  if(UI.modal){ html+=renderModal(); }

  root.innerHTML=html;
  bind();
}

function wavePattern(){
  // 鍛えた金属のヘアライン：右肩上がりの細線（積み上げの暗喩）
  var s='<svg style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:.05;pointer-events:none" viewBox="0 0 400 200" preserveAspectRatio="none"><defs><linearGradient id="wg" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#c8a84e" stop-opacity="0"/><stop offset="55%" stop-color="#e8d080" stop-opacity="1"/><stop offset="100%" stop-color="#c8a84e" stop-opacity="0"/></linearGradient></defs>';
  for(var i=0;i<7;i++){var y=180-i*9;s+='<line x1="-20" y1="'+(y+40)+'" x2="420" y2="'+(y-40)+'" stroke="url(#wg)" stroke-width="0.6" opacity="'+(0.5-i*0.05)+'"/>';}
  return s+'</svg>';
}

/* ---- トレーニングビュー ---- */
function renderWorkout(){
  var day=menu()[UI.day];
  var completed=0,total=0;
  day.exercises.forEach(function(ex){if(isSkipped(ex.id))return;var nc=setCountFor(ex);total+=nc;for(var i=0;i<nc;i++)if(getSet(ex.id,i).done)completed++;});
  var prog=total>0?(completed/total)*100:0;
  var h='';
  h+='<div style="padding:14px 18px 0"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:12px;color:var(--sub);font-weight:600">'+esc(day.title)+'</span><span style="font-size:12px;color:'+(prog===100?'var(--check)':'var(--muted)')+';font-weight:700">'+completed+'/'+total+(prog===100?' ✦ 共鳴完了':'')+'</span></div>';
  h+='<div style="height:4px;background:var(--borderLight);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+prog+'%;background:'+(prog===100?'linear-gradient(90deg,var(--check),var(--secondary))':'linear-gradient(90deg,var(--accent),var(--secondary))')+';border-radius:4px;transition:width .4s cubic-bezier(.4,0,.2,1)"></div></div></div>';

  h+='<div style="padding:6px 18px 130px">';
  if(day.exercises.length===0){h+='<div style="text-align:center;padding:60px 20px;color:var(--muted);font-size:13px">種目がまだないよ。「編集」タブから追加してね。</div>';}
  day.exercises.forEach(function(ex,exIdx){
    var isExp=UI.expanded===ex.id;
    var skip=isSkipped(ex.id);
    var nSets=setCountFor(ex);
    var exDone=!skip;for(var i=0;i<nSets;i++){if(!getSet(ex.id,i).done){exDone=false;break;}}
    var memo=getMemo(ex.id);
    var cardBg=skip?'rgba(255,255,255,0.02)':(exDone?'rgba(63,208,200,.04)':'var(--card)');
    var cardBd=skip?'var(--borderLight)':(exDone?'rgba(63,208,200,.2)':'var(--cardBorder)');
    h+='<div class="fade" style="margin-top:10px;border-radius:14px;border:1px solid '+cardBd+';background:'+cardBg+';overflow:hidden;box-shadow:var(--shadow);'+(skip?'opacity:.55;':'')+'">';
    h+='<div data-act="toggleExpand" data-ex="'+ex.id+'" style="padding:13px 14px;display:flex;align-items:center;gap:12px;user-select:none">';
    var badgeBg=skip?'#2a2a2a':(exDone?'var(--accent)':'#f6f6f5');
    var badgeCol=skip?'#888':(exDone?'#06201e':'#0a0a0a');
    h+='<div style="width:30px;height:30px;border-radius:8px;background:'+badgeBg+';display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:'+badgeCol+';flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.4)">'+(skip?'休':(exDone?'✦':(exIdx+1)))+'</div>';
    h+='<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700;color:'+((skip||exDone)?'var(--sub)':'var(--textBright)')+';'+((skip||exDone)?'text-decoration:line-through;opacity:.6;':'')+'display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+esc(ex.name)+(ex.warmup?'<span style="font-size:8px;padding:2px 6px;border-radius:4px;background:var(--warmupBg);color:var(--warmup);font-weight:700;border:1px solid rgba(63,208,200,.2)">WU</span>':'')+'</div>';
    h+='<div style="font-size:10px;color:var(--muted);margin-top:2px;display:flex;gap:8px"><span>'+esc(ex.target)+'</span>'+(ex.note?'<span style="opacity:.3">·</span><span style="color:var(--sub)">'+esc(ex.note)+'</span>':'')+'</div></div>';
    if(skip){
      h+='<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0"><div style="font-size:10px;font-weight:700;color:var(--sub);background:rgba(255,255,255,.05);border:1px solid var(--borderLight);border-radius:6px;padding:2px 8px;white-space:nowrap">今日は休み</div>';
      h+='<div style="font-size:12px;color:var(--muted);transform:'+(isExp?'rotate(180deg)':'rotate(0)')+';transition:transform .2s">▾</div></div></div>';
    }else{
      h+='<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0"><div style="font-size:10px;font-weight:700;color:var(--accent);background:var(--accentSoft);border:1px solid rgba(63,208,200,.2);border-radius:6px;padding:2px 7px;white-space:nowrap">REST '+fmtRest(restFor(ex))+'</div>';
      h+='<div style="font-size:12px;color:var(--muted);transform:'+(isExp?'rotate(180deg)':'rotate(0)')+';transition:transform .2s">▾</div></div></div>';
    }

    if(isExp){
      h+='<div style="padding:0 14px 14px;border-top:1px solid var(--borderLight)">';
      if(skip){
        h+='<div style="padding:18px 8px;text-align:center"><div style="font-size:13px;color:var(--sub);font-weight:600">今日はこの種目をお休み中</div>';
        h+='<div style="font-size:11px;color:var(--muted);margin-top:4px">記録には「お休み」と残るよ</div>';
        h+='<button data-act="toggleSkip" data-ex="'+ex.id+'" style="margin-top:12px;padding:9px 20px;border-radius:9px;border:1px solid var(--accent);background:var(--accentSoft);color:var(--accent);font-size:12px;font-weight:700">お休みを解除する</button></div>';
        h+='</div>';
        h+='</div>';
        return;
      }
      // 前回バナー
      var pd=prevDate(UI.day);
      if(pd){
        var ps=[];for(var j=0;j<nSets;j++){var pp=prevSet(UI.day,ex.id,j);if(pp)ps.push(pp);}
        if(ps.length){
          h+='<div style="padding:8px 12px;margin:10px 0 8px;background:rgba(74,158,173,.08);border-radius:8px;border:1px solid rgba(74,158,173,.15)">';
          h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-size:10px;color:var(--secondary);font-weight:700">前回 '+formatDate(pd)+'（参考）</span>';
          h+='<button data-act="fillAll" data-ex="'+ex.id+'" data-sets="'+nSets+'" style="font-size:10px;padding:3px 10px;border-radius:6px;border:1px solid var(--accent);background:var(--accentSoft);color:var(--accent);font-weight:700">前回を今日にコピー</button></div>';
          h+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
          ps.forEach(function(s,i){h+='<span style="font-size:11px;color:var(--sub);font-weight:600">S'+(i+1)+': '+(s.weight||"—")+'kg × '+(s.reps||"—")+'回</span>';});
          h+='</div></div>';
        }
      }
      h+='<div style="display:grid;grid-template-columns:30px 1fr 1fr 40px 36px;gap:6px;padding:4px 0;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:1px"><span>SET</span><span style="text-align:center">KG</span><span style="text-align:center">回数</span><span style="text-align:center">状態</span><span></span></div>';
      for(var si=0;si<nSets;si++){
        var sd=getSet(ex.id,si);
        var pp2=prevSet(UI.day,ex.id,si);
        var hasInput=(sd.weight!=="" || sd.reps!=="");
        var ph=pp2?(pp2.weight||"—"):"—";
        var phr=pp2?(pp2.reps||"—"):"—";
        var iid=ex.id+"_"+si;
        h+='<div style="display:grid;grid-template-columns:30px 1fr 1fr 40px 36px;gap:6px;align-items:center;padding:4px 0;opacity:'+(sd.done?'.55':'1')+'">';
        h+='<span style="font-size:14px;font-weight:800;color:var(--muted)">'+(si+1)+'</span>';
        // 重量
        h+='<input type="number" inputmode="decimal" data-field="weight" data-ex="'+ex.id+'" data-si="'+si+'" value="'+esc(sd.weight)+'" placeholder="'+esc(ph)+'" style="'+inpStyle(hasInput)+'">';
        // 回数
        h+='<input type="number" inputmode="numeric" data-field="reps" data-ex="'+ex.id+'" data-si="'+si+'" value="'+esc(sd.reps)+'" placeholder="'+esc(phr)+'" style="'+inpStyle(hasInput)+'">';
        // 保存済みバッジ
        h+='<div id="saved_'+iid+'" style="text-align:center;font-size:10px;font-weight:800;color:'+(hasInput?'var(--check)':'var(--muted)')+'">'+(hasInput?'保存':'—')+'</div>';
        // 完了トグル
        h+='<div data-act="toggleDone" data-ex="'+ex.id+'" data-si="'+si+'" style="width:32px;height:32px;border-radius:8px;border:1.5px solid '+(sd.done?'var(--check)':'var(--border)')+';background:'+(sd.done?'var(--checkGlow)':'transparent')+';display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:14px;color:var(--check);font-weight:800">'+(sd.done?'✦':'')+'</div>';
        h+='</div>';
      }
      // セット数の増減（その日だけ。メニュー自体は変えない）
      h+='<div style="margin-top:10px;display:flex;align-items:center;justify-content:center;gap:14px">';
      h+='<button data-act="setMinus" data-ex="'+ex.id+'" style="width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--glass);color:var(--sub);font-size:20px;font-weight:800;line-height:1">−</button>';
      h+='<span style="font-size:13px;color:var(--sub);font-weight:700;min-width:54px;text-align:center">'+nSets+' セット</span>';
      h+='<button data-act="setPlus" data-ex="'+ex.id+'" style="width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--glass);color:var(--accent);font-size:20px;font-weight:800;line-height:1">＋</button>';
      h+='</div>';
      // レスト開始ボタン（完了チェックとは独立）
      h+='<button data-act="startRestBtn" data-sec="'+restFor(ex)+'" style="margin-top:10px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--accent);background:var(--accentSoft);color:var(--accent);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px">⏱ レスト開始（'+fmtRest(restFor(ex))+'）</button>';
      h+='<div style="margin-top:8px"><input type="text" data-field="memo" data-ex="'+ex.id+'" value="'+esc(memo)+'" placeholder="メモ（調子・気づきなど）" style="width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--borderLight);background:var(--glass);color:var(--textBright);font-size:12px;outline:none"></div>';
      h+='<button data-act="toggleSkip" data-ex="'+ex.id+'" style="margin-top:10px;width:100%;padding:9px;border-radius:9px;border:1px dashed var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:700">今日はこの種目をお休みする</button>';
      h+='</div>';
    }
    h+='</div>';
  });
  h+='</div>';

  // 固定フッター
  h+='<div style="position:fixed;bottom:0;left:0;right:0;padding:12px 18px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;justify-content:center;gap:10px">';
  h+='<button data-act="copyToday" style="padding:13px 30px;border-radius:13px;border:none;background:var(--accent);color:#062925;font-size:13px;font-weight:800;letter-spacing:.5px;box-shadow:0 4px 18px rgba(63,208,200,.3)">今日の記録をコピー</button>';
  h+='<button data-act="clearToday" style="padding:13px 18px;border-radius:13px;border:1px solid var(--border);background:var(--glass);color:var(--sub);font-size:13px;font-weight:700">クリア</button>';
  h+='</div>';
  return h;
}

function inpStyle(filled){
  return 'width:100%;padding:11px 6px;border-radius:8px;border:1px solid '+(filled?'var(--check)':'var(--border)')+';background:'+(filled?'rgba(78,205,196,.06)':'rgba(10,14,26,0.8)')+';color:var(--textBright);font-size:16px;font-weight:700;outline:none;text-align:center;box-sizing:border-box';
}

/* ---- 履歴ビュー ---- */
function renderHistory(){
  var day=menu()[UI.day];
  var hist=history(UI.day);
  var h='<div style="padding:12px 18px 40px">';
  if(hist.length===0){h+='<div style="text-align:center;padding:60px 20px;color:var(--muted);font-size:13px">Day '+UI.day+' の記録はまだない</div></div>';return h;}
  hist.forEach(function(session){
    var isToday=session.date===todayStr();
    h+='<div style="margin-top:12px;border-radius:14px;border:1px solid var(--cardBorder);background:var(--card);overflow:hidden;box-shadow:var(--shadow)">';
    h+='<div style="padding:14px 14px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--borderLight)">';
    h+='<div><div style="font-size:14px;font-weight:800;color:'+(isToday?'var(--accent)':'var(--textBright)')+'">'+formatDateFull(session.date)+(isToday?'<span style="font-size:9px;margin-left:8px;color:var(--bg);font-weight:700;background:var(--accent);padding:2px 8px;border-radius:4px">TODAY</span>':'')+'</div>';
    h+='<div style="font-size:10px;color:var(--muted);margin-top:2px">Day '+UI.day+' · '+esc(day.title)+'</div></div>';
    if(!isToday){h+='<button data-act="delSession" data-date="'+session.date+'" style="padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:10px;font-weight:600">削除</button>';}
    h+='</div><div style="padding:10px 14px 14px">';
    day.exercises.forEach(function(ex){
      var sets=[];for(var i=0;i<20;i++){var s=session.sets[ex.id+"_s"+i];if(s)sets.push(s);}
      if(!sets.length)return;
      h+='<div style="margin-top:8px"><div style="font-size:11px;font-weight:700;color:var(--sub);margin-bottom:5px">'+esc(ex.name)+'</div><div style="display:flex;gap:6px;flex-wrap:wrap">';
      sets.forEach(function(s){h+='<div style="font-size:11px;color:'+(s.done?'var(--textBright)':'var(--muted)')+';background:'+(s.done?'var(--checkGlow)':'var(--glass)')+';padding:4px 10px;border-radius:6px;border:1px solid '+(s.done?'rgba(78,205,196,.2)':'var(--borderLight)')+';font-weight:600">'+(s.weight||"—")+'kg × '+(s.reps||"—")+'回'+(s.done?'<span style="color:var(--check);margin-left:4px;font-size:10px">✦</span>':'')+'</div>';});
      h+='</div></div>';
    });
    h+='</div></div>';
  });
  h+='</div>';
  return h;
}

/* ---- 編集ビュー ---- */
function renderEdit(){
  var day=menu()[UI.day];
  var dayKeys=Object.keys(menu()).map(Number).sort(function(a,b){return a-b;});
  var h='<div style="padding:12px 18px 60px">';

  // プログラム終了日
  h+='<div style="border-radius:14px;border:1px solid var(--cardBorder);background:var(--card);padding:16px;box-shadow:var(--shadow);margin-bottom:12px">';

  if(prog().endDate){h+='<button data-act="clearEnd" style="margin-top:8px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:700">カウントダウンを解除</button>';}

  h+='<div style="display:flex;flex-direction:column;gap:8px">';

  h+='</div>';

  // 種目一覧
  h+='<div style="margin-top:12px;border-radius:14px;border:1px solid var(--cardBorder);background:var(--card);overflow:hidden;box-shadow:var(--shadow)">';
  h+='<div style="padding:14px 16px 10px;border-bottom:1px solid var(--borderLight)"><div style="font-size:13px;font-weight:700;color:var(--accent)">種目一覧</div></div>';
  day.exercises.forEach(function(ex,idx){
    h+='<div style="padding:10px 14px;border-bottom:1px solid var(--borderLight);display:flex;align-items:center;gap:10px">';
    h+='<div style="display:flex;flex-direction:column;gap:2px">';
    h+='<button data-act="moveEx" data-idx="'+idx+'" data-dir="-1" style="font-size:10px;padding:2px 6px;border:none;background:transparent;color:'+(idx===0?'var(--borderLight)':'var(--muted)')+'">▲</button>';
    h+='<button data-act="moveEx" data-idx="'+idx+'" data-dir="1" style="font-size:10px;padding:2px 6px;border:none;background:transparent;color:'+(idx===day.exercises.length-1?'var(--borderLight)':'var(--muted)')+'">▼</button></div>';
    h+='<div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--textBright)">'+esc(ex.name)+'</div><div style="font-size:10px;color:var(--muted)">'+esc(ex.target)+(ex.warmup?' · WU':'')+(ex.note?' · '+esc(ex.note):'')+'</div></div>';
    h+='<div style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--sub)"><button data-act="setSets" data-ex="'+ex.id+'" data-n="'+(ex.sets-1)+'" style="width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--glass);color:var(--sub);font-weight:800">−</button><span style="min-width:34px;text-align:center;font-weight:700">'+ex.sets+'set</span><button data-act="setSets" data-ex="'+ex.id+'" data-n="'+(ex.sets+1)+'" style="width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--glass);color:var(--sub);font-weight:800">+</button></div>';
    h+='<button data-act="delEx" data-ex="'+ex.id+'" data-name="'+esc(ex.name)+'" style="font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid rgba(192,57,43,.2);background:var(--dangerBg);color:var(--danger);font-weight:600">削除</button>';
    h+='</div>';
  });
  h+='<div style="padding:12px 14px"><button data-act="openAddEx" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--accent);background:var(--accentSoft);color:var(--accent);font-size:13px;font-weight:700">＋ 種目を追加</button></div>';
  h+='</div>';

  // Day追加
  h+='<button data-act="openAddDay" style="width:100%;margin-top:12px;padding:14px;border-radius:14px;border:1px solid var(--accent);background:var(--accentSoft);color:var(--accent);font-size:13px;font-weight:700">＋ 新しいDAYを追加</button>';
  h+='</div>';
  return h;
}
function editInp(){return 'width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(10,14,26,.8);color:var(--textBright);font-weight:700;outline:none;text-align:left';}

/* ---- モーダル ---- */

  if(m.type==="programs"){
    h+='<div style="font-size:16px;font-weight:800;color:var(--accentLight);margin-bottom:4px">プログラム管理</div>';
    h+='<div style="font-size:11px;color:var(--sub);margin-bottom:16px">怪我・増量期・サイクル変更ごとに、メニュー一式を切り替えられるよ。記録はプログラムごとに別々に貯まる。</div>';

      var act=pid===DB.activePid;
      h+='<div style="display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;border:1px solid '+(act?'var(--accent)':'var(--border)')+';background:'+(act?'var(--accentSoft)':'var(--glass)')+';margin-bottom:8px">';
      h+='<input type="text" data-field="progName" data-pid="'+pid+'" value="'+esc(DB.programs[pid].name)+'" style="flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(10,14,26,.8);color:var(--textBright);font-weight:700;outline:none">';
      if(!act){h+='<button data-act="switchProg" data-pid="'+pid+'" style="padding:8px 12px;border-radius:8px;border:1px solid var(--accent);background:var(--accentSoft);color:var(--accent);font-size:12px;font-weight:700">使う</button>';}
      else{h+='<span style="font-size:11px;color:var(--accent);font-weight:700;padding:0 6px">使用中</span>';}
      if(Object.keys(DB.programs).length>1){h+='<button data-act="delProg" data-pid="'+pid+'" data-name="'+esc(DB.programs[pid].name)+'" style="padding:8px 10px;border-radius:8px;border:1px solid rgba(192,57,43,.2);background:var(--dangerBg);color:var(--danger);font-size:12px;font-weight:700">削除</button>';}
      h+='</div>';
    });
    h+='<div style="display:flex;gap:8px;margin-top:14px">';
    h+='<button data-act="addProgBlank" style="flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--glass);color:var(--sub);font-size:12px;font-weight:700">＋ 空で新規作成</button>';
    h+='<button data-act="addProgCopy" style="flex:1;padding:11px;border-radius:10px;border:1px solid var(--accent);background:var(--accentSoft);color:var(--accent);font-size:12px;font-weight:700">現プログラムを複製</button>';
    h+='</div>';

    // メニュー差し替え（本命機能）
    h+='<div style="border-top:1px solid var(--borderLight);margin-top:18px;padding-top:16px">';
    h+='<div style="font-size:12px;font-weight:700;color:var(--accentLight);margin-bottom:8px">🔄 メニューを差し替え（使用中：<span style="color:var(--accent)">'+esc(prog().name)+'</span>）</div>';
    h+='<div style="font-size:10px;color:var(--muted);margin-bottom:8px">筋トレスレで組んだメニューJSONを貼って、今のプログラムのメニューを丸ごと差し替えるよ。<b style="color:var(--sub)">記録は消えずにそのまま残る。</b>怪我用・サイクル変更のたびにこれで更新できる。</div>';
    h+='<textarea id="menuBox" rows="5" placeholder=\'{"1":{"title":"胸・肩","subtitle":"...","exercises":[{"id":"n1e1","name":"ベンチプレス","target":"胸","sets":3,"warmup":true}]}, "2":{...}}\'></textarea>';
    h+='<button data-act="doReplaceMenu" style="margin-top:8px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--accent);background:var(--accentSoft);color:var(--accent);font-size:12px;font-weight:700">このメニューで「'+esc(prog().name)+'」を差し替える</button>';
    h+='</div>';

    h+='<div style="border-top:1px solid var(--borderLight);margin-top:18px;padding-top:16px">';
    h+='<div style="font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px">📥 記録のインポート（旧バージョンの記録を取り込む）</div>';
    h+='<div style="font-size:10px;color:var(--muted);margin-bottom:8px">旧アプリで <b>Copy value</b> した文字列を貼って取り込めるよ。今のデータには上書きせず、新しいプログラムとして追加する。</div>';
    h+='<textarea id="importBox" rows="4" placeholder=\'{"sessions":{...},"menu":{...}}\'></textarea>';
    h+='<button data-act="doImport" style="margin-top:8px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--secondary);background:rgba(74,158,173,.1);color:var(--secondary);font-size:12px;font-weight:700">この記録を新プログラムとして取り込む</button>';
    h+='</div>';
    h+='<div style="border-top:1px solid var(--borderLight);margin-top:18px;padding-top:16px">';
    h+='<button data-act="doFullReset" style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(192,57,43,.3);background:var(--dangerBg);color:var(--danger);font-size:11px;font-weight:700">⟲ 最新メニューに初期化（困ったとき用・記録は消える）</button>';
    h+='</div>';
    h+='<button data-act="closeModal" style="margin-top:16px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:13px;font-weight:700">閉じる</button>';
  }
  else if(m.type==="addEx"){
    h+='<div style="font-size:15px;font-weight:800;color:var(--accentLight);margin-bottom:14px">種目を追加</div>';
    h+='<div style="display:flex;flex-direction:column;gap:8px">';
    h+='<input type="text" id="newExName" placeholder="種目名" style="'+editInp()+';font-size:14px">';
    h+='<input type="text" id="newExTarget" placeholder="部位（胸・背中など）" style="'+editInp()+';font-size:13px">';
    h+='<label style="display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px"><input type="checkbox" id="newExWU" style="width:18px;height:18px;accent-color:var(--accent)">ウォームアップあり</label>';
    h+='</div><div style="display:flex;gap:8px;margin-top:16px"><button data-act="confirmAddEx" style="flex:1;padding:12px;border-radius:10px;border:none;background:#f6f6f5;color:#0a0a0a;font-weight:700">追加</button><button data-act="closeModal" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-weight:700">キャンセル</button></div>';
  }
  else if(m.type==="addDay"){
    h+='<div style="font-size:15px;font-weight:800;color:var(--accentLight);margin-bottom:14px">新しいDayを追加</div>';
    h+='<div style="display:flex;flex-direction:column;gap:8px">';
    h+='<input type="text" id="newDayTitle" placeholder="Dayタイトル" style="'+editInp()+';font-size:14px">';
    h+='<input type="text" id="newDaySub" placeholder="サブタイトル（任意）" style="'+editInp()+';font-size:13px">';
    h+='</div><div style="display:flex;gap:8px;margin-top:16px"><button data-act="confirmAddDay" style="flex:1;padding:12px;border-radius:10px;border:none;background:#f6f6f5;color:#0a0a0a;font-weight:700">追加</button><button data-act="closeModal" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-weight:700">キャンセル</button></div>';
  }
  h+='</div></div>';
  return h;
}

/* ============================ イベント束ね ============================ */
function bind(){
  // 入力（重量・回数・メモ）→ 再描画せず直接保存（フォーカス維持＆記録消失防止）
  Array.prototype.forEach.call(root.querySelectorAll('input[data-field]'),function(inp){
    var f=inp.getAttribute("data-field");
    if(f==="weight"||f==="reps"){
      // input: 実際のキー操作。空にした場合もユーザー意図なので反映。
      var saveOnInput=function(){
        var ex=inp.getAttribute("data-ex"),si=parseInt(inp.getAttribute("data-si"));
        var patch={};patch[f]=inp.value;writeSet(ex,si,patch);
        flashSaved(ex,si);markFilled(ex,si);
      };
      // blur/change: フォーカス外れ等。★空値では絶対に上書きしない（勝手な消失を防ぐ）。
      var saveOnBlur=function(){
        if(inp.value==="")return;               // 空なら何もしない＝既存値を守る
        var ex=inp.getAttribute("data-ex"),si=parseInt(inp.getAttribute("data-si"));
        var patch={};patch[f]=inp.value;writeSet(ex,si,patch);
        flashSaved(ex,si);markFilled(ex,si);
      };
      inp.addEventListener("input",saveOnInput);
      inp.addEventListener("change",saveOnBlur);
      inp.addEventListener("blur",saveOnBlur);
    }else if(f==="memo"){
      var saveMemo=function(){setMemo(inp.getAttribute("data-ex"),inp.value);};
      inp.addEventListener("input",saveMemo);
      inp.addEventListener("change",saveMemo);
      inp.addEventListener("blur",saveMemo);
    }else if(f==="endDate"){
      inp.addEventListener("change",function(){prog().endDate=inp.value;saveDB();render();});
    }else if(f==="dayTitle"){ inp.addEventListener("input",function(){updateDayInfo("title",inp.value);}); }
    else if(f==="daySub"){ inp.addEventListener("input",function(){updateDayInfo("subtitle",inp.value);}); }
    else if(f==="progName"){ inp.addEventListener("input",function(){renameProgram(inp.getAttribute("data-pid"),inp.value);}); }
  });

  // クリック系
  Array.prototype.forEach.call(root.querySelectorAll('[data-act]'),function(el){
    el.addEventListener("click",function(e){
      // ★どのボタンを押すときも、入力中(フォーカス中)の値をまず確定保存する
      flushActiveInput();
      var act=el.getAttribute("data-act");
      if(act==="closeModalBg"){ if(e.target===el){UI.modal=null;render();} return; }
      e.stopPropagation();
      handle(act,el);
    });
  });
  // モーダル内クリックの伝播止め
  Array.prototype.forEach.call(root.querySelectorAll('[data-stop]'),function(el){el.addEventListener("click",function(e){e.stopPropagation();});});
}

/* 画面内の全入力欄(重量・回数・メモ)の現在値を、保存処理に流し込んで確定させる。
   「数字を打ってから確定せずにボタンを押した」ときの記録消失を防ぐ要。
   フォーカス中の1欄だけでなく全欄を走査するので、複数欄に打った直後でも取りこぼさない。 */
function flushActiveInput(){
  try{
    if(!root)return;
    Array.prototype.forEach.call(root.querySelectorAll('input[data-field]'),function(inp){
      var f=inp.getAttribute("data-field");
      if(f==="weight"||f==="reps"){
        var ex=inp.getAttribute("data-ex"),si=parseInt(inp.getAttribute("data-si"));
        if(ex!=null&&!isNaN(si)){
          // ★空値では書き込まない。画面に値がある時だけ、データと違えば保存する。
          //   （renderで作られた空欄が既存の記録を空で潰すのを防ぐ）
          if(inp.value!==""){
            var cur=getSet(ex,si);
            if((""+inp.value)!==(""+cur[f])){var patch={};patch[f]=inp.value;writeSet(ex,si,patch);}
          }
        }
      }else if(f==="memo"){
        var exm=inp.getAttribute("data-ex");
        if(exm!=null && inp.value!==getMemo(exm)) setMemo(exm,inp.value);
      }
    });
    var a=document.activeElement; if(a&&a.blur&&a.getAttribute&&a.getAttribute("data-field"))a.blur();
  }catch(e){}
}

function flashSaved(ex,si){
  var el=document.getElementById("saved_"+ex+"_"+si);
  if(el){el.textContent="保存";el.style.color=cv("check");el.style.animation="savedPulse .4s ease";setTimeout(function(){el.style.animation="";},400);}
}
function markFilled(ex,si){
  var sd=getSet(ex,si);var filled=(sd.weight!==""||sd.reps!=="");
  Array.prototype.forEach.call(root.querySelectorAll('input[data-ex="'+ex+'"][data-si="'+si+'"]'),function(inp){
    inp.style.border="1px solid "+(filled?cv("check"):cv("border"));
    inp.style.background=filled?"rgba(78,205,196,.06)":"rgba(10,14,26,0.8)";
  });
  if(!filled){var el=document.getElementById("saved_"+ex+"_"+si);if(el){el.textContent="—";el.style.color=cv("muted");}}
}

function handle(act,el){
  switch(act){
    case "switchProg": switchProgram(el.getAttribute("data-pid")); UI.modal=null; render(); break;
    case "openPrograms": UI.modal={type:"programs"}; render(); break;
    case "setDay": UI.day=parseInt(el.getAttribute("data-day")); UI.expanded=null; UI.view="workout"; render(); break;
    case "setView": UI.view=el.getAttribute("data-view"); render(); break;
    case "toggleExpand": var ex=el.getAttribute("data-ex"); UI.expanded=(UI.expanded===ex?null:ex); render(); break;
    case "toggleDone":
      toggleDone(el.getAttribute("data-ex"),parseInt(el.getAttribute("data-si")));
      render();
      break;
    case "setPlus": changeSetCount(el.getAttribute("data-ex"),1); render(); break;
    case "setMinus": changeSetCount(el.getAttribute("data-ex"),-1); render(); break;
    case "startRestBtn":
      startRest(parseInt(el.getAttribute("data-sec")));
      break;
    case "toggleSkip": toggleSkip(el.getAttribute("data-ex")); render(); break;
    case "fillAll": fillAllFromPrev(el.getAttribute("data-ex"),parseInt(el.getAttribute("data-sets"))); render(); break;
    case "copyToday":
      var txt=exportToday();
      copyText(txt,el);
      break;
    case "clearToday":
      if(confirm("今日の入力データ（重量・回数・メモ）をクリアする？")){clearToday();UI.expanded=null;render();}
      break;
    case "delSession": deleteSessionByDate(el.getAttribute("data-date")); render(); break;
    case "clearEnd": prog().endDate=""; saveDB(); render(); break;
    case "moveEx": moveExercise(parseInt(el.getAttribute("data-idx")),parseInt(el.getAttribute("data-dir"))); render(); break;
    case "setSets": setExSets(el.getAttribute("data-ex"),parseInt(el.getAttribute("data-n"))); render(); break;
    case "delEx": if(confirm(el.getAttribute("data-name")+" を削除する？")){removeExercise(el.getAttribute("data-ex"));render();} break;
    case "delDay": if(confirm("Day "+UI.day+" を削除する？")){removeDay(UI.day);render();} break;
    case "openAddEx": UI.modal={type:"addEx"}; render(); break;
    case "openAddDay": UI.modal={type:"addDay"}; render(); break;
    case "confirmAddEx":
      addExercise(val("newExName"),val("newExTarget"),document.getElementById("newExWU").checked);
      UI.modal=null; render(); break;
    case "confirmAddDay":
      addDay(val("newDayTitle"),val("newDaySub")); UI.modal=null; render(); break;
    case "closeModal": UI.modal=null; render(); break;
    case "addProgBlank": addProgram("新しいプログラム",{1:{title:"Day 1",subtitle:"カスタム",exercises:[]}}); UI.modal=null; render(); break;
    case "addProgCopy": addProgram(prog().name+" のコピー", deepCopy(menu())); UI.modal=null; render(); break;
    case "delProg": if(confirm("プログラム「"+el.getAttribute("data-name")+"」を削除する？記録も消えるよ。")){removeProgram(el.getAttribute("data-pid"));render();} break;
    case "doImport": doImport(); break;
    case "doFullReset": doFullReset(); break;
    case "doReplaceMenu": doReplaceMenu(); break;
  }
}

function val(id){var e=document.getElementById(id);return e?e.value:"";}

function copyText(txt,btn){
  function ok(){var old=btn.textContent;btn.textContent="✦ コピーした！";btn.style.color=cv("check");btn.style.borderColor=cv("check");setTimeout(function(){btn.textContent=old;btn.style.color=cv("accent");btn.style.borderColor=cv("accent");},1800);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok).catch(function(){fallbackCopy(txt);ok();});}
  else{fallbackCopy(txt);ok();}
}
function fallbackCopy(txt){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);}

function deleteSessionByDate(date){var key="day"+UI.day+"_"+date;delete sessions()[key];var pre=key+"_";var mm=memos();Object.keys(mm).forEach(function(k){if(k.indexOf(pre)===0)delete mm[k];});saveDB();}

function doReplaceMenu(){
  var box=document.getElementById("menuBox");if(!box)return;
  var raw=box.value.trim();if(!raw){alert("貼り付けが空だよ");return;}
  var r=replaceMenuFromJSON(raw);
  alert(r.msg);
  if(r.ok){UI.modal=null;UI.view="workout";}
  render();
}

function doFullReset(){
  if(!confirm("全データをリセットして、最新メニュー（AC関節期＋通常）の初期状態に戻す？\n今ある記録は消えるよ。"))return;
  cleanupLegacy();
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  DB = seedDB(); saveDB(DB);
  UI.day=null; UI.view="workout"; UI.expanded=null; UI.modal=null;
  ensureDay();
  alert("最新の状態にリセットしたよ。");
  render();
}

function doImport(){
  var box=document.getElementById("importBox");if(!box)return;
  var raw=box.value.trim();if(!raw){alert("貼り付けが空だよ");return;}
  var obj;
  try{obj=JSON.parse(raw);}catch(e){alert("読み取れなかった。{ } で始まる文字列をそのまま貼ってね。");return;}
  // 旧形式 {sessions,menu,memos,endDate} を1プログラムとして取り込む
  if(!obj.menu&&!obj.sessions){alert("メニューも記録も見つからなかった。形式を確認してね。");return;}
  var pid=genPid();
  DB.programs[pid]={
    name:"取り込んだ記録",
    menu: obj.menu||deepCopy(NORMAL_MENU),
    sessions: obj.sessions||{},
    memos: obj.memos||{},
    endDate: obj.endDate||""
  };
  saveDB();
  var n=Object.keys(obj.sessions||{}).length;
  alert("取り込み完了！「取り込んだ記録」プログラムを追加したよ（記録 "+n+" 件）。名前は管理画面で変えられる。");
  render();
}

/* ============================ 起動 ============================ */
render();
</script>
